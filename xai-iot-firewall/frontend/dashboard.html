<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IoT Firewall — Real-time Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0e1a;
            --surface: #111827;
            --surface2: #1c2333;
            --border: #2a3347;
            --accent: #00d4ff;
            --accent2: #7c3aed;
            --safe: #10b981;
            --risk: #ef4444;
            --text: #e2e8f0;
            --muted: #64748b;
            --mono: 'Monaco', monospace;
            --radius: 12px;
            --shadow: 0 4px 32px rgba(0, 0, 0, 0.5);
        }

        html,
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                radial-gradient(ellipse 80% 60% at 50% -10%, rgba(0, 212, 255, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(124, 58, 237, 0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .wrapper {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #e2e8f0 30%, var(--accent));
            -webkit-text-fill-color: transparent;
            -webkit-background-clip: text;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--safe);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-family: var(--mono);
        }

        .status-badge.live::before {
            content: '';
            width: 8px;
            height: 8px;
            background: var(--safe);
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        @media (max-width: 1200px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin: 8px 0;
        }

        .stat-label {
            font-size: 13px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chart-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        @media (max-width: 1200px) {
            .chart-container {
                grid-template-columns: 1fr;
            }
        }

        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            position: relative;
            height: 320px;
        }

        .alerts-section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .alerts-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alerts-header h2 {
            font-size: 16px;
        }

        .refresh-time {
            font-size: 12px;
            color: var(--muted);
        }

        .alerts-feed {
            max-height: 500px;
            overflow-y: auto;
        }

        .alert-item {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .alert-item:hover {
            background: var(--surface2);
        }

        .alert-info {
            flex: 1;
        }

        .alert-flow {
            font-family: var(--mono);
            font-size: 12px;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .alert-threat {
            display: inline-block;
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .threat-high {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }

        .threat-medium {
            background: rgba(251, 146, 60, 0.2);
            color: #fed7aa;
        }

        .threat-low {
            background: rgba(34, 197, 94, 0.2);
            color: #bbf7d0;
        }

        .alert-time {
            font-size: 12px;
            color: var(--muted);
            text-align: right;
            min-width: 80px;
        }

        .no-alerts {
            padding: 40px 24px;
            text-align: center;
            color: var(--muted);
        }

        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 12px 16px;
            text-align: center;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab.active {
            border-bottom-color: var(--accent);
            color: var(--accent);
        }

        .tab:hover {
            background: var(--surface2);
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <header>
            <div class="title">
                <h1>🚨 Real-time IDS Dashboard</h1>
            </div>
            <div class="status-badge live">● LIVE</div>
        </header>

        <!-- Stats Grid -->
        <div class="grid">
            <div class="card">
                <div class="stat-label">Total Alerts</div>
                <div class="stat-value" id="total-alerts">0</div>
            </div>
            <div class="card">
                <div class="stat-label">High Threat</div>
                <div class="stat-value" style="color: var(--risk);" id="high-threat">0</div>
            </div>
            <div class="card">
                <div class="stat-label">Medium Threat</div>
                <div class="stat-value" style="color: #fb923c;" id="medium-threat">0</div>
            </div>
            <div class="card">
                <div class="stat-label">Anomalies Detected</div>
                <div class="stat-value" style="color: var(--accent);" id="anomalies">0</div>
            </div>
        </div>

        <!-- Charts -->
        <div class="chart-container">
            <div class="chart-card">
                <canvas id="threat-chart"></canvas>
            </div>
            <div class="chart-card">
                <canvas id="prediction-chart"></canvas>
            </div>
        </div>

        <!-- Alerts Feed -->
        <div class="alerts-section">
            <div class="alerts-header">
                <h2>📡 Recent Alerts</h2>
                <div class="refresh-time">
                    Last updated: <span id="last-update">--:--:--</span>
                </div>
            </div>
            <div class="tabs">
                <div class="tab active" onclick="filterAlerts('all')">All</div>
                <div class="tab" onclick="filterAlerts('high')">🔴 High</div>
                <div class="tab" onclick="filterAlerts('medium')">🟠 Medium</div>
                <div class="tab" onclick="filterAlerts('low')">🟢 Low</div>
            </div>
            <div class="alerts-feed" id="alerts-feed">
                <div class="no-alerts">No alerts yet. Waiting for traffic...</div>
            </div>
        </div>
    </div>

    <script>
        let threatChart, predictionChart;
        let currentFilter = 'all';
        let allAlerts = [];

        // Initialize charts
        function initCharts() {
            const ctx1 = document.getElementById('threat-chart').getContext('2d');
            threatChart = new Chart(ctx1, {
                type: 'doughnut',
                data: {
                    labels: ['High', 'Medium', 'Low'],
                    datasets: [{
                        data: [0, 0, 0],
                        backgroundColor: ['#ef4444', '#fb923c', '#22c55e'],
                        borderColor: '#111827',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#e2e8f0', font: { size: 12 } } }
                    }
                }
            });

            const ctx2 = document.getElementById('prediction-chart').getContext('2d');
            predictionChart = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: ['Risk', 'Safe'],
                    datasets: [{
                        label: 'Predictions',
                        data: [0, 0],
                        backgroundColor: ['#ef4444', '#10b981'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    indexAxis: 'y',
                    plugins: {
                        legend: { labels: { color: '#e2e8f0' } }
                    },
                    scales: {
                        x: { ticks: { color: '#64748b' }, grid: { color: '#2a3347' } }
                    }
                }
            });
        }

        // Fetch and update data
        async function updateDashboard() {
            try {
                const response = await fetch('http://localhost:5000/summary');
                const summary = await response.json();

                document.getElementById('total-alerts').textContent = summary.total_alerts || 0;
                document.getElementById('high-threat').textContent = summary.high_threat || 0;
                document.getElementById('medium-threat').textContent = summary.medium_threat || 0;
                document.getElementById('anomalies').textContent = summary.total_anomalies || 0;

                threatChart.data.datasets[0].data = [
                    summary.high_threat || 0,
                    summary.medium_threat || 0,
                    summary.low_threat || 0
                ];
                threatChart.update();

                predictionChart.data.datasets[0].data = [
                    summary.total_anomalies || 0,
                    (summary.total_alerts || 0) - (summary.total_anomalies || 0)
                ];
                predictionChart.update();

                // Fetch alerts
                const alertsResponse = await fetch('http://localhost:5000/alerts?limit=50');
                const alertsData = await alertsResponse.json();
                allAlerts = alertsData.alerts || [];

                renderAlerts();
                document.getElementById('last-update').textContent = new Date().toLocaleTimeString();

            } catch (err) {
                console.error('Update error:', err);
            }
        }

        function renderAlerts() {
            const feed = document.getElementById('alerts-feed');
            let filtered = allAlerts;

            if (currentFilter !== 'all') {
                filtered = allAlerts.filter(a => a.threat_level?.toUpperCase() === currentFilter.toUpperCase());
            }

            if (filtered.length === 0) {
                feed.innerHTML = '<div class="no-alerts">No alerts in this category</div>';
                return;
            }

            feed.innerHTML = filtered.map(alert => `
                <div class="alert-item">
                    <div class="alert-info">
                        <div class="alert-flow">${alert.src_ip}:${alert.src_port} → ${alert.dst_ip}:${alert.dst_port}</div>
                        <span class="alert-threat threat-${alert.threat_level?.toLowerCase() || 'low'}">
                            ${alert.threat_level} THREAT
                        </span>
                    </div>
                    <div class="alert-time">${new Date(alert.created_at).toLocaleTimeString()}</div>
                </div>
            `).join('');
        }

        function filterAlerts(level) {
            currentFilter = level;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderAlerts();
        }

        // Initialize
        initCharts();
        updateDashboard();

        // Auto-refresh every 3 seconds
        setInterval(updateDashboard, 3000);
    </script>
</body>

</html>
